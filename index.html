<style>
  :root{
    --bg:#0a0a0a; --card:#171717; --card2:#262626; --linea:#2a2a2a;
    --txt:#f5f5f5; --txt2:#a3a3a3; --txt3:#737373;
    --azul:#3b82f6; --azul-b:#60a5fa; --verde:#22c55e; --rojo:#f87171; --ambar:#fbbf24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;}
  input,textarea,button{font-family:inherit;}
  input,textarea{font-size:16px;} /* evita el zoom automático de Safari */

  .app{max-width:520px; margin:0 auto; min-height:100vh;
       padding-bottom:calc(140px + env(safe-area-inset-bottom));}
  .px{padding-left:16px; padding-right:16px;}
  .muted{color:var(--txt2);} .muted3{color:var(--txt3);}
  .small{font-size:13px;} .xs{font-size:12px;}
  .b{font-weight:700;} .sb{font-weight:600;}
  .num{font-variant-numeric:tabular-nums;}
  h1{font-size:26px; margin:0; letter-spacing:-0.02em;}
  h2{font-size:16px; margin:0 0 10px;}
  h3{font-size:16px; margin:0;}

  .barra{position:sticky; top:0; z-index:30; background:var(--bg);
         border-bottom:1px solid #141414; padding-top:env(safe-area-inset-top);}
  .barra-in{display:flex; align-items:center; gap:12px; padding:10px 16px;}

  .btn{border:0; border-radius:12px; font-weight:700; font-size:15px;
       display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;}
  .btn-cuadro{width:44px; height:44px; background:var(--card2); color:var(--txt);}
  .btn-verde{padding:0 18px; height:44px; background:var(--verde); color:#052e16;}
  .btn-azul{width:100%; height:52px; background:#2563eb; color:#fff; font-size:16px;}
  .btn-azul-suave{width:100%; height:48px; background:rgba(37,99,235,.18); color:var(--azul-b);}
  .btn-rojo-suave{width:100%; height:48px; background:rgba(239,68,68,.14); color:var(--rojo);}
  .btn-gris{width:100%; height:46px; background:var(--card2); color:#e5e5e5; font-size:14px;}
  .btn:disabled{opacity:.45;}

  .card{background:var(--card); border:1px solid var(--linea); border-radius:16px; padding:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .avatar{display:flex; align-items:center; justify-content:center;
          border-radius:12px; font-weight:800; flex:0 0 auto;}

  /* fila de serie */
  .fila{display:flex; align-items:center; gap:8px; padding:4px; border-radius:12px;}
  .fila.ok{background:rgba(34,197,94,.14);}
  .badge{width:36px; height:36px; border-radius:10px; background:var(--card2);
         border:0; color:#e5e5e5; font-weight:700; font-size:14px;}
  .prev{flex:1; text-align:center; font-size:14px; color:var(--txt2);
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .inp{width:62px; height:36px; border-radius:10px; background:var(--card2); border:0;
       color:#fff; text-align:center; outline:none;}
  .inp::placeholder{color:#6b6b6b;}
  .chk{width:42px; height:36px; border-radius:10px; background:var(--card2); border:0;
       color:#737373; display:flex; align-items:center; justify-content:center;}
  .chk.on{background:var(--verde); color:#052e16;}
  .cabecera-tabla{display:flex; align-items:center; gap:8px; padding:0 4px 4px;
                  font-size:12px; font-weight:600; color:var(--txt2);}
  .descanso{display:flex; align-items:center; gap:8px; padding:4px 0;}
  .descanso .lin{height:1px; flex:1; background:var(--linea);}
  .descanso .t{font-size:12px; font-weight:600; color:var(--azul-b);}

  /* overlays */
  .fondo{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.65);
         display:flex; align-items:flex-end; justify-content:center;}
  .hoja{width:100%; max-width:520px; background:var(--card);
        border-top:1px solid var(--linea); border-radius:24px 24px 0 0;
        padding:12px 12px calc(28px + env(safe-area-inset-bottom));}
  .op{width:100%; display:flex; align-items:center; gap:12px; padding:15px 12px;
      background:none; border:0; color:var(--txt); font-weight:600; font-size:15px;
      text-align:left; border-radius:12px;}
  .modal-lleno{width:100%; max-width:520px; height:92vh; background:var(--bg);
               border-top:1px solid var(--linea); border-radius:24px 24px 0 0;
               display:flex; flex-direction:column;}
  .buscador{display:flex; align-items:center; gap:8px; height:44px; border-radius:12px;
            background:var(--card2); padding:0 12px;}
  .buscador input{flex:1; background:none; border:0; color:#fff; outline:none;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .chip{padding:0 12px; height:36px; border-radius:10px; border:0; background:var(--card2);
        color:var(--txt2); font-size:14px; font-weight:500; white-space:nowrap;}
  .chip.on{background:#2563eb; color:#fff;}
  .item{width:100%; display:flex; align-items:center; gap:12px; padding:8px 0;
        background:none; border:0; border-bottom:1px solid #141414; color:var(--txt); text-align:left;}
  .radio{width:24px; height:24px; border-radius:50%; border:2px solid #3f3f46;
         display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .radio.on{background:#2563eb; border-color:#2563eb; color:#fff;}
  .ta{width:100%; border-radius:12px; background:var(--card2); border:0; color:#fff;
      padding:12px; outline:none; resize:none;}

  .rest{position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:center;
        pointer-events:none;}
  .rest-in{width:100%; max-width:520px; padding:12px 12px calc(12px + env(safe-area-inset-bottom));
           pointer-events:auto;}
  .rest-card{background:var(--card); border:1px solid var(--linea); border-radius:18px; overflow:hidden;}
  .rest-prog{height:4px; background:var(--card2);}
  .rest-prog span{display:block; height:100%; background:var(--azul);}
  .rest-body{display:flex; align-items:center; gap:8px; padding:12px;}

  .toast{position:fixed; left:0; right:0; top:calc(12px + env(safe-area-inset-top)); z-index:60;
         display:flex; justify-content:center; pointer-events:none;}
  .toast div{background:#2f2f2f; border:1px solid #404040; border-radius:12px;
             padding:10px 16px; font-size:14px; font-weight:500; max-width:90%;}
  .aviso{border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px;}
  .aviso.warn{background:rgba(251,191,36,.14); color:var(--ambar);}
  .aviso.err{background:rgba(239,68,68,.14); color:var(--rojo);}
  .centro{display:flex; flex-direction:column; align-items:center; justify-content:center;
          min-height:70vh; text-align:center; gap:12px;}
  .spin{width:26px; height:26px; border:3px solid #333; border-top-color:var(--azul);
        border-radius:50%; animation:g 0.8s linear infinite;}
  @keyframes g{to{transform:rotate(360deg);}}
  code{background:var(--card2); padding:2px 6px; border-radius:6px; font-size:13px;}
</style>

<script type="text/babel" data-presets="react">
/* =========================================================================
   CONFIGURACIÓN — las dos únicas líneas que debes editar
   ========================================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbw49hB3x1D27OU3wHFlOmKbg7DeR5jr34-V2mDhTixFRCZsglDQcgpcyN7I8YEtePaO/exec";
const TOKEN   = "8mK2x9PqL4wV7tY1bC0eR3zN5";

/* ========================================================================= */

const { useState, useEffect, useMemo, useRef } = React;

// Se muestra abajo del Home: sirve para confirmar de un vistazo qué versión
// quedó realmente publicada después de subir los archivos.
const VERSION = "v9";

/* --- utilidades ---------------------------------------------------------- */
const pad = n => String(n).padStart(2, "0");
const fmtCrono = s => { const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=Math.floor(s%60);
  return h > 0 ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const fmtMMSS = s => `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
const isoDe = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoyISO = () => isoDe(new Date());
const fechaCorta = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-"); return `${d}-${m}-${y}`; };
const horaAhora = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const nombrePorHora = () => { const h = new Date().getHours();
  return h < 12 ? "Entrenamiento por la mañana" : h < 19 ? "Entrenamiento por la tarde" : "Entrenamiento por la noche"; };
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
let _seq = 0;
const nuevoId = p => `${p}-${Date.now().toString(36)}${(++_seq).toString(36)}`;
const iniciales = n => n.replace(/[()\-]/g," ").split(" ").filter(w=>w.length>2).slice(0,2)
  .map(w=>w[0].toUpperCase()).join("");

const COLOR = { "Pecho":"#f43f5e","Espalda":"#10b981","Hombros":"#f59e0b","Bíceps":"#38bdf8",
  "Tríceps":"#a78bfa","Piernas":"#fb923c","Glúteos":"#ec4899","Core":"#2dd4bf",
  "Cardio":"#a3e635","Full Body":"#818cf8" };

/* Miniatura que crece al tocarla y vuelve a su tamaño al tocar fuera.
   La imagen ampliada flota sobre el contenido: no empuja la lista.

   Los GIF quedan congelados en la miniatura: se dibuja el primer fotograma
   en un canvas y recién al ampliar se monta el <img> real, que sí se anima.
   Así la lista no tiene diez animaciones corriendo a la vez. */
function AvatarZoom({ nombre, musculo, url, size = 34, zoom = 150, zoomable = true }) {
  const [abierto, setAbierto] = useState(false);
  const [falla, setFalla] = useState(false);
  const [congelada, setCongelada] = useState(false);
  const [srcZoom, setSrcZoom] = useState("");
  const [pase, setPase] = useState(0);
  const lienzo = useRef(null);
  const fuente = useRef(null);

  // WebKit (iOS) comparte una única copia decodificada por URL entre todos los
  // elementos. Al dibujar el GIF en el canvas, esa copia queda detenida en el
  // fotograma de ese instante, y el <img> del zoom la hereda congelada.
  // Por eso el zoom pide la MISMA imagen con otra query: distinto recurso,
  // línea de tiempo propia. En el Mac da igual, en el iPhone es la diferencia
  // entre que se anime y que no.
  const urlZoom = url ? url + (url.indexOf("?") === -1 ? "?" : "&") + "gz=1" : "";

  const pintar = () => {
    const c = lienzo.current, img = fuente.current;
    if (!c || !img || !img.naturalWidth) return false;
    try {
      const dpr = window.devicePixelRatio || 1;
      const px = Math.round(size * dpr);
      c.width = px; c.height = px;
      const lado = Math.min(img.naturalWidth, img.naturalHeight);
      c.getContext("2d").drawImage(img,
        (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, px, px);
      return true;
    } catch (e) { return false; }
  };

  useEffect(() => {
    if (!url) return;
    setCongelada(false);
    fuente.current = null;
    let vivo = true;

    const img = new Image();
    img.onload = () => {
      if (!vivo) return;
      fuente.current = img;
      if (pintar()) { setCongelada(true); return; }
      requestAnimationFrame(() => { if (vivo && pintar()) setCongelada(true); });
    };
    img.onerror = () => { if (vivo) setFalla(true); };
    img.src = url;

    return () => { vivo = false; };
  }, [url, size]);

  useEffect(() => {
    if (abierto || !fuente.current) return;
    if (pintar()) setCongelada(true);
  }, [abierto]);

  const abrir = () => {
    if (!zoomable) return;
    setSrcZoom(urlZoom);
    setPase(n => n + 1);   // fuerza un elemento nuevo: el GIF parte de cero
    setAbierto(true);
  };

  if (!url || falla) return <Avatar nombre={nombre} musculo={musculo} size={size}/>;

  const usarLienzo = congelada && !abierto;
  const lado = abierto ? zoom : size;

  const base = {
    position:"absolute", top:0, left:0, width:lado, height:lado,
    borderRadius:12, objectFit:"cover", background:"#fff",
    cursor: zoomable ? "pointer" : "default"
  };

  return (
    <React.Fragment>
      {abierto && <div style={{position:"fixed", inset:0, zIndex:44}} onClick={() => setAbierto(false)}/>}
      <div style={{position:"relative", width:size, height:size, flex:"0 0 auto",
                   zIndex: abierto ? 45 : 1, pointerEvents: zoomable ? "auto" : "none"}}>

        <canvas ref={lienzo} onClick={abrir}
          style={Object.assign({}, base, { display: usarLienzo ? "block" : "none" })}/>

        {!usarLienzo && (
          // key cambia en cada apertura: elemento nuevo, animación desde el inicio.
          // Sin transiciones ni sombra encima del <img>: en iOS eso también
          // puede rasterizar el GIF y dejarlo quieto.
          <img key={"z" + pase} src={abierto ? (srcZoom || url) : url} alt={nombre}
            onError={() => {
              // Si el servidor rechaza la query extra, se vuelve a la URL limpia.
              if (abierto && srcZoom && srcZoom !== url) setSrcZoom(url);
              else setFalla(true);
            }}
            onClick={() => { if (!zoomable) return; abierto ? setAbierto(false) : abrir(); }}
            style={Object.assign({}, base, abierto
              ? { boxShadow:"0 12px 34px rgba(0,0,0,.65)" } : {})}/>
        )}
      </div>
    </React.Fragment>
  );
}

/* --- iconos (SVG en línea, sin dependencias) ------------------------------ */
const Svg = ({ d, size=20, fill="none", extra }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {Array.isArray(d) ? d.map((p,i)=><path key={i} d={p}/>) : <path d={d}/>}
    {extra}
  </svg>
);
const IcCheck  = p => <Svg {...p} d="M20 6 9 17l-5-5"/>;
const IcX      = p => <Svg {...p} d={["M18 6 6 18","M6 6l12 12"]}/>;
const IcPlus   = p => <Svg {...p} d={["M5 12h14","M12 5v14"]}/>;
const IcMinus  = p => <Svg {...p} d="M5 12h14"/>;
const IcTimer  = p => <Svg {...p} d={["M10 2h4","M12 14v-4"]} extra={<circle cx="12" cy="14" r="8"/>}/>;
const IcClock  = p => <Svg {...p} d="M12 6v6l4 2" extra={<circle cx="12" cy="12" r="10"/>}/>;
const IcCal    = p => <Svg {...p} d={["M8 2v4","M16 2v4","M3 10h18"]} extra={<rect x="3" y="4" width="18" height="18" rx="2"/>}/>;
const IcSearch = p => <Svg {...p} d="m21 21-4.3-4.3" extra={<circle cx="11" cy="11" r="8"/>}/>;
const IcTrash  = p => <Svg {...p} d={["M3 6h18","M8 6V4h8v2","M6 6l1 14h10l1-14"]}/>;
const IcNota   = p => <Svg {...p} d={["M14 2H6v20h12V8z","M14 2v6h6","M9 13h6","M9 17h4"]}/>;
const IcFuego  = p => <Svg {...p} d="M12 2c1 4 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 1-3s-3 2-3 5a6 6 0 0 0 12 0c0-5-6-7-6-11z"/>;
const IcSwap   = p => <Svg {...p} d={["M17 2l4 4-4 4","M3 11V9a4 4 0 0 1 4-4h14","M7 22l-4-4 4-4","M21 13v2a4 4 0 0 1-4 4H3"]}/>;
const IcPesa   = p => <Svg {...p} d={["M6 6v12","M18 6v12","M3 9v6","M21 9v6","M6 12h12"]}/>;
const IcSube   = p => <Svg {...p} d={["M3 17l6-6 4 4 8-8","M17 7h4v4"]}/>;
const IcPlay   = p => <Svg {...p} fill="currentColor" d="M6 4l14 8-14 8z"/>;
const IcNube   = p => <Svg {...p} d={["M21 12a9 9 0 1 1-3-6.7","M21 3v6h-6"]}/>;
const IcMas    = p => <Svg {...p} d="M5 12h.01M12 12h.01M19 12h.01" strokeWidth="3"/>;
const IcGraf   = p => <Svg {...p} d={["M3 3v18h18","M7 15v3","M12 9v9","M17 5v13"]}/>;
const IcLapiz  = p => <Svg {...p} d={["M12 20h9","M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"]}/>;
const IcCopia  = p => <Svg {...p} d={["M9 3h9a2 2 0 0 1 2 2v9","M5 7h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"]}/>;
const IcArriba = p => <Svg {...p} d="m18 15-6-6-6 6"/>;
const IcAbajo  = p => <Svg {...p} d="m6 9 6 6 6-6"/>;

/* =========================================================================
   CAPA DE DATOS: API + caché local + cola de envíos
   ========================================================================= */
const K_CACHE = "gymlog.cache";
const K_COLA  = "gymlog.cola";
const K_NUEVOS = "gymlog.ejerciciosNuevos";

const guardaLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const leeLocal = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } };

const configurada = () => API_URL.indexOf("http") === 0 && TOKEN.indexOf("PEGA_AQUI") !== 0;

const API = {
  async bootstrap(fresco) {
    const r = await fetch(`${API_URL}?action=bootstrap&token=${encodeURIComponent(TOKEN)}${fresco ? "&fresco=1" : ""}`,
      { method: "GET", redirect: "follow" });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Respuesta inválida");
    return j.datos;
  },
  // text/plain a propósito: evita el preflight OPTIONS que Apps Script no responde
  async post(accion, payload) {
    const r = await fetch(API_URL, {
      method: "POST", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ action: accion, token: TOKEN }, payload))
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "No se pudo guardar");
    return j;
  },
  guardar(payload)           { return API.post("guardarEntrenamiento", payload); },
  guardarPlantilla(payload)  { return API.post("guardarPlantilla", payload); },
  crearEjercicio(payload)    { return API.post("crearEjercicio", payload); },
  eliminarPlantilla(id)      { return API.post("eliminarPlantilla", { id }); }
};

/* =========================================================================
   COMPONENTES
   ========================================================================= */
function Avatar({ nombre, musculo, url, size = 42 }) {
  const [falla, setFalla] = useState(false);
  const c = COLOR[musculo] || "#94a3b8";

  // Si la URL está vacía o el servidor la rechaza (hotlinking, 404, enlace
  // caducado), se muestran las iniciales. Nunca queda un cuadro roto.
  if (url && !falla) return (
    <img src={url} alt="" loading="lazy" onError={() => setFalla(true)}
      style={{ width:size, height:size, minWidth:size, flex:"0 0 auto",
               borderRadius:12, objectFit:"cover", background:"#fff" }}/>
  );

  return <div className="avatar" style={{ width:size, height:size, minWidth:size,
    background:c+"22", color:c, fontSize:size*0.34 }}>{iniciales(nombre)}</div>;
}

function FilaSerie({ serie, etiqueta, anterior, onCambio, onCheck, onMenu }) {
  return (
    <div>
      <div className={"fila" + (serie.check ? " ok" : "")}>
        <button className="badge" onClick={onMenu}
          style={serie.esCalentamiento ? { color:"var(--ambar)" } : null}>{etiqueta}</button>
        <div className="prev">{anterior ? anterior.texto : "—"}</div>
        <input className="inp num" inputMode="decimal" value={serie.kg}
          placeholder={anterior ? String(anterior.kg) : "0"}
          onChange={e => onCambio("kg", e.target.value)} />
        <input className="inp num" inputMode="numeric" value={serie.reps}
          placeholder={anterior ? String(anterior.reps) : "0"}
          onChange={e => onCambio("reps", e.target.value)} />
        <button className={"chk" + (serie.check ? " on" : "")} onClick={onCheck}>
          <IcCheck size={18}/>
        </button>
      </div>
      {serie.notas ? <div className="xs muted" style={{margin:"2px 50px 6px 46px", fontStyle:"italic"}}>{serie.notas}</div> : null}
    </div>
  );
}

function Bloque({ bloque, ej, historial, onMenuEjercicio, onMenuSerie, onCambio, onCheck, onAgregarSerie }) {
  const cat = ej[bloque.idEjercicio] || { nombre:"(ejercicio no encontrado)", musculo:"Core" };
  const prev = historial[bloque.idEjercicio];
  let n = 0;
  return (
    <div style={{marginBottom:26}}>
      <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:4}}>
        <AvatarZoom nombre={cat.nombre} musculo={cat.musculo} url={cat.urlImagen} size={34} zoom={160}/>
        <h3 style={{flex:1, color:"var(--azul-b)", lineHeight:1.15}}>{cat.nombre}</h3>
        <button className="btn btn-cuadro" style={{width:36, height:36, color:"var(--azul-b)"}}
          onClick={onMenuEjercicio}><IcMas size={18}/></button>
      </div>
      <p className="xs muted3" style={{margin:"0 0 8px 2px"}}>
        {prev ? `Último registro: ${fechaCorta(prev.fecha)} · ${prev.series.length} sets`
              : "Primer registro de este ejercicio"}
      </p>
      {bloque.nota ? <div className="card small" style={{marginBottom:8}}>{bloque.nota}</div> : null}

      <div className="cabecera-tabla">
        <div style={{width:36, textAlign:"center"}}>Serie</div>
        <div style={{flex:1, textAlign:"center"}}>Anterior</div>
        <div style={{width:62, textAlign:"center"}}>kg</div>
        <div style={{width:62, textAlign:"center"}}>Rep.</div>
        <div style={{width:42, display:"flex", justifyContent:"center"}}><IcCheck size={14}/></div>
      </div>

      {bloque.series.map(s => {
        let etiqueta = "C", anterior = null;
        if (!s.esCalentamiento) {
          const i = n; n += 1; etiqueta = String(n);
          const ref = prev ? (prev.series[i] || prev.series[prev.series.length - 1]) : null;
          if (ref) anterior = { kg: ref.kg, reps: ref.reps, texto: `${ref.kg} kg × ${ref.reps}` };
        }
        return (
          <div key={s.id}>
            <FilaSerie serie={s} etiqueta={etiqueta} anterior={anterior}
              onCambio={(c,v) => onCambio(s.id, c, v)}
              onCheck={() => onCheck(s.id, anterior)}
              onMenu={() => onMenuSerie(s.id)} />
            <div className="descanso">
              <div className="lin"/><span className="t">{fmtMMSS(bloque.descansoSeg)}</span><div className="lin"/>
            </div>
          </div>
        );
      })}

      <button className="btn btn-gris" onClick={onAgregarSerie}>
        + Añadir serie ({fmtMMSS(bloque.descansoSeg)})
      </button>
    </div>
  );
}

const MUSCULOS = ["Todos","Pecho","Espalda","Hombros","Bíceps","Tríceps","Piernas","Glúteos","Core","Cardio","Full Body"];
const CATEGORIAS = ["Barra","Mancuernas","Máquina","Polea","Peso corporal"];

/* Alta rápida de un ejercicio que no está en el catálogo, pensada para
   resolverlo de pie en el gimnasio: nombre, grupo muscular y poco más. */
function FormNuevoEjercicio({ onCrear, onCancelar, creando }) {
  const [nombre, setNombre] = useState("");
  const [musculo, setMusculo] = useState("Pecho");
  const [categoria, setCategoria] = useState("Máquina");
  const [descanso, setDescanso] = useState(90);
  const [series, setSeries] = useState(3);
  const [reps, setReps] = useState("10");
  const [url, setUrl] = useState("");

  const listo = nombre.trim().length > 1 && !creando;

  return (
    <div className="px" style={{flex:1, overflowY:"auto", paddingBottom:40}}>
      <p className="small sb muted" style={{margin:"4px 0 6px"}}>Nombre del ejercicio</p>
      <input className="ta" autoFocus value={nombre} placeholder="Ej: Remo en máquina Hammer"
        onChange={e => setNombre(e.target.value)} style={{height:48, marginBottom:18}}/>

      <p className="small sb muted" style={{margin:"0 0 6px"}}>Grupo muscular</p>
      <div className="chips" style={{marginBottom:18, flexWrap:"wrap"}}>
        {MUSCULOS.filter(m => m !== "Todos").map(m => (
          <button key={m} className={"chip" + (musculo === m ? " on" : "")}
            style={{marginBottom:6}} onClick={() => setMusculo(m)}>{m}</button>
        ))}
      </div>

      <p className="small sb muted" style={{margin:"0 0 6px"}}>Equipo</p>
      <div className="chips" style={{marginBottom:18, flexWrap:"wrap"}}>
        {CATEGORIAS.map(c => (
          <button key={c} className={"chip" + (categoria === c ? " on" : "")}
            style={{marginBottom:6}} onClick={() => setCategoria(c)}>{c}</button>
        ))}
      </div>

      <p className="small sb muted" style={{margin:"0 0 6px"}}>Descanso entre series</p>
      <div className="chips" style={{marginBottom:18}}>
        {[30,60,90,120,150,180].map(d => (
          <button key={d} className={"chip" + (descanso === d ? " on" : "")}
            onClick={() => setDescanso(d)}>{fmtMMSS(d)}</button>
        ))}
      </div>

      <p className="small sb muted" style={{margin:"0 0 6px"}}>Lo que planeas hacer hoy</p>
      <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:8}}>
        <span className="small muted3" style={{flex:1}}>Series</span>
        <button className="btn" style={{width:34, height:34, background:"var(--card2)", color:"var(--txt)"}}
          onClick={() => setSeries(n => Math.max(1, n-1))}><IcMinus size={14}/></button>
        <span className="b num" style={{width:24, textAlign:"center"}}>{series}</span>
        <button className="btn" style={{width:34, height:34, background:"var(--card2)", color:"var(--txt)"}}
          onClick={() => setSeries(n => Math.min(10, n+1))}><IcPlus size={14}/></button>
      </div>
      <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:18}}>
        <span className="small muted3" style={{flex:1}}>Reps objetivo</span>
        <input className="inp num" inputMode="numeric" value={reps}
          onChange={e => setReps(e.target.value)} style={{width:72, height:34}}/>
      </div>

      <p className="small sb muted" style={{margin:"0 0 6px"}}>URL de la imagen (opcional)</p>
      <input className="ta" value={url} placeholder="https://..."
        onChange={e => setUrl(e.target.value)} style={{height:44, marginBottom:20, fontSize:14}}/>

      <button className="btn btn-azul" disabled={!listo}
        onClick={() => onCrear({ nombre: nombre.trim(), musculo, categoria, descansoSeg: descanso,
          urlImagen: url.trim(), series, reps: reps.trim() })}>
        {creando ? "Guardando…" : "Crear y añadir"}
      </button>
      <button className="btn btn-gris" style={{marginTop:10}} onClick={onCancelar}>Volver al catálogo</button>
      <p className="xs muted3" style={{marginTop:14}}>
        El ejercicio queda guardado en Catalogo_Ejercicios y estará disponible siempre.
        Las series y reps de arriba son solo para dejar la tabla lista hoy.
      </p>
    </div>
  );
}

function ModalCatalogo({ catalogo, modo, historial, onConfirmar, onCerrar, onCrear, creando }) {
  const [q, setQ] = useState("");
  const [m, setM] = useState("Todos");
  const [sel, setSel] = useState([]);
  const [nuevo, setNuevo] = useState(false);

  const lista = useMemo(() => {
    const t = q.trim().toLowerCase();
    return catalogo
      .filter(e => (m === "Todos" || e.musculo === m) &&
        (t === "" || `${e.nombre} ${e.musculo} ${e.categoria}`.toLowerCase().includes(t)))
      .sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
  }, [q, m, catalogo]);

  const grupos = useMemo(() => {
    const g = {};
    lista.forEach(e => { const l = e.nombre[0].toUpperCase(); (g[l] = g[l] || []).push(e); });
    return g;
  }, [lista]);

  const toca = id => { if (modo === "reemplazar") return onConfirmar([id]);
    setSel(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]); };

  return (
    <div className="fondo">
      <div className="modal-lleno">
        <div style={{display:"flex", alignItems:"center", gap:12, padding:"16px 16px 8px"}}>
          <button className="btn btn-cuadro" style={{width:36, height:36}}
            onClick={() => nuevo ? setNuevo(false) : onCerrar()}><IcX size={18}/></button>
          <h3 style={{flex:1}}>
            {nuevo ? "Ejercicio nuevo" : (modo === "reemplazar" ? "Remplazar ejercicio" : "Añadir ejercicios")}
          </h3>
          {!nuevo && onCrear && (
            <button className="btn" style={{padding:"0 12px", height:36, fontSize:14,
              background:"var(--card2)", color:"var(--azul-b)"}} onClick={() => setNuevo(true)}>
              <IcPlus size={15}/> Nuevo
            </button>
          )}
          {!nuevo && modo !== "reemplazar" && (
            <button className="btn" disabled={!sel.length} onClick={() => onConfirmar(sel)}
              style={{padding:"0 16px", height:36, fontSize:14,
                background: sel.length ? "#2563eb" : "var(--card2)", color: sel.length ? "#fff" : "#525252"}}>
              Añadir {sel.length ? `(${sel.length})` : ""}
            </button>
          )}
        </div>

        {nuevo && <FormNuevoEjercicio onCrear={onCrear} creando={creando} onCancelar={() => setNuevo(false)}/>}

        {!nuevo && <div className="px" style={{paddingBottom:8}}>
          <div className="buscador">
            <IcSearch size={18}/><input value={q} placeholder="Buscar" onChange={e => setQ(e.target.value)}/>
            {q ? <button className="btn" style={{background:"none", color:"var(--txt3)"}} onClick={() => setQ("")}><IcX size={16}/></button> : null}
          </div>
        </div>}

        {!nuevo && <div className="px chips" style={{paddingBottom:10}}>
          {MUSCULOS.map(x => (
            <button key={x} className={"chip" + (m === x ? " on" : "")} onClick={() => setM(x)}>
              {x === "Todos" ? "Cualquier parte del cuerpo" : x}
            </button>
          ))}
        </div>}

        {!nuevo && <div className="px" style={{flex:1, overflowY:"auto", paddingBottom:30}}>
          {!lista.length && <p className="small muted3" style={{textAlign:"center", padding:"40px 0"}}>
            Sin resultados. Prueba otro nombre o cambia el filtro.</p>}
          {Object.keys(grupos).map(l => (
            <div key={l}>
              <p className="small sb muted3" style={{margin:"10px 0 4px"}}>{l}</p>
              {grupos[l].map(e => {
                const on = sel.includes(e.id), prev = historial[e.id];
                return (
                  <button key={e.id} className="item" onClick={() => toca(e.id)}>
                    <AvatarZoom nombre={e.nombre} musculo={e.musculo} url={e.urlImagen} zoomable={false}/>
                    <div style={{flex:1, minWidth:0}}>
                      <p className="sb" style={{margin:0, lineHeight:1.2}}>{e.nombre}</p>
                      <p className="small muted3" style={{margin:0}}>{e.musculo} · {e.categoria}</p>
                    </div>
                    {prev ? <span className="xs muted3">{prev.series[0].kg} kg</span> : null}
                    <div className={"radio" + (on ? " on" : "")}>{on ? <IcCheck size={14}/> : null}</div>
                  </button>
                );
              })}
            </div>
          ))}
        </div>}
      </div>
    </div>
  );
}

function EditorPlantilla({ inicial, catalogo, historial, guardando, creandoEj, onCrearEjercicio, onGuardar, onCerrar }) {
  const [nombre, setNombre] = useState(inicial ? inicial.nombreRutina : "");
  const [items, setItems] = useState(inicial ? inicial.items : []);
  const [catAbierto, setCatAbierto] = useState(false);

  const ej = useMemo(() => Object.fromEntries(catalogo.map(e => [e.id, e])), [catalogo]);

  const mover = (i, dir) => setItems(xs => {
    const j = i + dir; if (j < 0 || j >= xs.length) return xs;
    const c = [...xs]; const t = c[i]; c[i] = c[j]; c[j] = t; return c;
  });
  const quitar = i => setItems(xs => xs.filter((_,k) => k !== i));
  const series = (i, d) => setItems(xs => xs.map((x,k) =>
    k === i ? { ...x, seriesObjetivo: Math.max(1, Math.min(10, x.seriesObjetivo + d)) } : x));

  const temporales = items.filter(x => String(x.idEjercicio).indexOf("TMP-") === 0);
  const puedeGuardar = nombre.trim().length > 0 && items.length > 0 && !guardando && !temporales.length;

  return (
    <div style={{minHeight:"100vh"}}>
      <div className="barra"><div className="barra-in">
        <button className="btn btn-cuadro" style={{width:36, height:36}} onClick={onCerrar}><IcX size={18}/></button>
        <h3 style={{flex:1, textAlign:"center"}}>{inicial && inicial.id ? "Editar plantilla" : "Nueva plantilla"}</h3>
        <button className="btn btn-verde" disabled={!puedeGuardar}
          onClick={() => onGuardar({ id: inicial ? inicial.id : "", nombre: nombre.trim(),
            ejercicios: items.map(x => ({ idEjercicio: x.idEjercicio, seriesObjetivo: x.seriesObjetivo })) })}>
          {guardando ? "Guardando…" : "Guardar"}
        </button>
      </div></div>

      <div className="px" style={{paddingTop:18}}>
        <p className="small sb muted" style={{margin:"0 0 6px"}}>Nombre de la rutina</p>
        <input className="ta" value={nombre} placeholder="Ej: Empuje pesado"
          onChange={e => setNombre(e.target.value)} style={{height:48, marginBottom:20}}/>

        {temporales.length > 0 && (
          <div className="aviso err">
            Hay {temporales.length} ejercicio(s) sin registrar en el catálogo. Quítalos de la lista
            y vuelve a agregarlos con conexión: una plantilla no puede apuntar a un ejercicio provisorio.
          </div>
        )}

        <p className="small sb muted" style={{margin:"0 0 8px"}}>
          Ejercicios ({items.length}) · el orden es el de ejecución
        </p>

        {!items.length && (
          <div style={{border:"1px dashed var(--linea)", borderRadius:16, padding:26, textAlign:"center", marginBottom:14}}>
            <p className="small muted" style={{margin:0}}>Añade el primer ejercicio a la rutina.</p>
          </div>
        )}

        {items.map((x, i) => {
          const c = ej[x.idEjercicio] || { nombre:"(no encontrado)", musculo:"Core" };
          return (
            <div key={x.idEjercicio + "-" + i} className="card" style={{marginBottom:8, padding:10}}>
              <div style={{display:"flex", alignItems:"center", gap:10}}>
                <AvatarZoom nombre={c.nombre} musculo={c.musculo} url={c.urlImagen} size={36} zoom={150}/>
                <div style={{flex:1, minWidth:0}}>
                  <p className="sb" style={{margin:0, lineHeight:1.2}}>{c.nombre}</p>
                  <p className="xs muted3" style={{margin:0}}>{c.musculo} · descanso {fmtMMSS(c.descansoSeg || 90)}</p>
                </div>
                <div style={{display:"flex", flexDirection:"column", gap:2}}>
                  <button className="btn" style={{width:30, height:22, background:"var(--card2)", color:"var(--txt2)"}}
                    onClick={() => mover(i,-1)}><IcArriba size={14}/></button>
                  <button className="btn" style={{width:30, height:22, background:"var(--card2)", color:"var(--txt2)"}}
                    onClick={() => mover(i, 1)}><IcAbajo size={14}/></button>
                </div>
              </div>
              <div style={{display:"flex", alignItems:"center", gap:8, marginTop:10}}>
                <span className="xs muted3" style={{flex:1}}>Sets sugeridos</span>
                <button className="btn" style={{width:32, height:32, background:"var(--card2)", color:"var(--txt)"}}
                  onClick={() => series(i,-1)}><IcMinus size={14}/></button>
                <span className="b num" style={{width:22, textAlign:"center"}}>{x.seriesObjetivo}</span>
                <button className="btn" style={{width:32, height:32, background:"var(--card2)", color:"var(--txt)"}}
                  onClick={() => series(i, 1)}><IcPlus size={14}/></button>
                <button className="btn" style={{width:32, height:32, background:"rgba(239,68,68,.14)", color:"var(--rojo)"}}
                  onClick={() => quitar(i)}><IcTrash size={14}/></button>
              </div>
            </div>
          );
        })}

        <button className="btn btn-azul-suave" style={{marginTop:6}} onClick={() => setCatAbierto(true)}>
          Añadir ejercicios
        </button>
        <p className="xs muted3" style={{marginTop:12}}>
          Los sets sugeridos solo se usan la primera vez. Después la app carga tantas series como hiciste
          la última vez que entrenaste ese ejercicio.
        </p>
      </div>

      {catAbierto && (
        <ModalCatalogo catalogo={catalogo} modo="agregar" historial={historial} creando={creandoEj}
          onCerrar={() => setCatAbierto(false)}
          onConfirmar={ids => {
            setItems(xs => [...xs, ...ids.map(id => ({ idEjercicio:id, seriesObjetivo:3 }))]);
            setCatAbierto(false);
          }}
          onCrear={async def => {
            try {
              const e = await onCrearEjercicio(def, false);
              setItems(xs => [...xs, { idEjercicio:e.id, seriesObjetivo: def.series || 3 }]);
              setCatAbierto(false);
            } catch (err) { /* el aviso ya lo mostró la app; no se agrega nada */ }
          }}/>
      )}
    </div>
  );
}

function BarraDescanso({ d, onAjustar, onSaltar }) {
  const pct = Math.max(0, Math.min(100, (d.restante / d.total) * 100));
  return (
    <div className="rest"><div className="rest-in"><div className="rest-card">
      <div className="rest-prog"><span style={{width: pct + "%"}}/></div>
      <div className="rest-body">
        <button className="btn btn-cuadro" onClick={() => onAjustar(-15)}><IcMinus/></button>
        <div style={{flex:1, textAlign:"center"}}>
          <p className="b num" style={{margin:0, fontSize:24, color:"var(--azul-b)"}}>{fmtMMSS(d.restante)}</p>
          <p className="xs muted3" style={{margin:0}}>Descanso en curso</p>
        </div>
        <button className="btn btn-cuadro" onClick={() => onAjustar(15)}><IcPlus/></button>
        <button className="btn btn-cuadro" style={{color:"var(--rojo)"}} onClick={onSaltar}><IcX/></button>
      </div>
    </div></div></div>
  );
}

function Home({ datos, pendientes, sinRed, refrescando, onIniciarVacio, onIniciarPlantilla, onSincronizar,
                onRecargar, onNuevaPlantilla, onMenuPlantilla }) {
  const ej = useMemo(() => Object.fromEntries(datos.catalogo.map(e => [e.id, e])), [datos.catalogo]);

  const resumen = id => datos.plantillasDetalle
    .filter(d => d.idPlantilla === id).sort((a,b) => a.orden - b.orden)
    .map(d => (ej[d.idEjercicio] || {}).nombre).filter(Boolean).join(", ");

  const volumen = id => datos.series
    .filter(s => s.idEntrenamiento === id && s.check && !s.esCalentamiento)
    .reduce((a,s) => a + s.kg * s.reps, 0);

  const hist = [...datos.entrenamientos].sort((a,b) => a.fecha < b.fecha ? 1 : -1).slice(0, 12);

  return (
    <div className="px">
      <header style={{padding:"calc(20px + env(safe-area-inset-top)) 0 16px", display:"flex", alignItems:"center", gap:10}}>
        <div style={{flex:1}}>
          <h1>Entrenar</h1>
          <p className="small muted3" style={{margin:"4px 0 0"}}>
            {datos.entrenamientos.length} sesiones · {datos.series.filter(s => s.check).length} sets registrados
          </p>
        </div>
        <button className="btn btn-cuadro" onClick={onRecargar} style={refrescando ? {opacity:.5} : null}>
          {refrescando ? <div className="spin" style={{width:18, height:18, borderWidth:2}}/> : <IcNube/>}
        </button>
      </header>

      {sinRed && <div className="aviso warn">Sin conexión. Puedes entrenar igual: lo guardado se envía solo cuando vuelva la red.</div>}
      {pendientes > 0 && (
        <div className="aviso warn" style={{display:"flex", alignItems:"center", gap:10}}>
          <span style={{flex:1}}>{pendientes} entrenamiento(s) por subir a la hoja.</span>
          <button className="btn" style={{background:"var(--card2)", color:"var(--txt)", padding:"6px 12px", height:32, fontSize:13}}
            onClick={onSincronizar}>Sincronizar</button>
        </div>
      )}

      <section style={{marginBottom:26}}>
        <h2>Inicio rápido</h2>
        <button className="btn btn-azul" onClick={onIniciarVacio}><IcPlay size={18}/> Iniciar un entrenamiento vacío</button>
      </section>

      <section style={{marginBottom:26}}>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10}}>
          <h2 style={{margin:0}}>Plantillas ({datos.plantillasHeader.length})</h2>
          <button className="btn" style={{background:"rgba(37,99,235,.18)", color:"var(--azul-b)",
            padding:"0 12px", height:34, fontSize:14}} onClick={onNuevaPlantilla}>
            <IcPlus size={16}/> Nueva
          </button>
        </div>

        {!datos.plantillasHeader.length && (
          <div style={{border:"1px dashed var(--linea)", borderRadius:16, padding:24, textAlign:"center"}}>
            <p className="small muted" style={{margin:0}}>No tienes plantillas. Crea la primera con el botón Nueva.</p>
          </div>
        )}

        <div className="grid2">
          {datos.plantillasHeader.map(p => (
            <div key={p.id} className="card" style={{position:"relative"}}>
              <div onClick={() => onIniciarPlantilla(p)}>
                <p className="b" style={{margin:"0 0 4px", lineHeight:1.2, paddingRight:34}}>{p.nombreRutina}</p>
                <p className="xs muted3" style={{margin:0, minHeight:46, lineHeight:1.35}}>
                  {resumen(p.id).slice(0,70)}{resumen(p.id).length > 70 ? "…" : ""}
                </p>
                <p className="xs muted3" style={{margin:"8px 0 0", display:"flex", alignItems:"center", gap:4, fontStyle:"italic"}}>
                  <IcClock size={12}/> {p.fechaUltima ? fechaCorta(p.fechaUltima) : "sin usar"}
                </p>
              </div>
              <button className="btn" style={{position:"absolute", top:8, right:8, width:30, height:30,
                background:"var(--card2)", color:"var(--azul-b)"}}
                onClick={e => { e.stopPropagation(); onMenuPlantilla(p); }}><IcMas size={16}/></button>
            </div>
          ))}
        </div>
      </section>

      <section>
        <h2>Historial</h2>
        {hist.map(e => (
          <div key={e.id} className="card" style={{marginBottom:8}}>
            <div style={{display:"flex", alignItems:"center", gap:8}}>
              <span className="muted3" style={{display:"flex"}}><IcGraf size={16}/></span>
              <p className="sb" style={{flex:1, margin:0}}>{e.nombre}</p>
              <p className="xs muted3" style={{margin:0}}>{fechaCorta(e.fecha)}</p>
            </div>
            <p className="small muted3" style={{margin:"4px 0 0"}}>
              {volumen(e.id).toLocaleString("es-CL")} kg de volumen · {datos.series.filter(s => s.idEntrenamiento === e.id && s.check).length} sets
            </p>
          </div>
        ))}
        <p className="xs muted3" style={{textAlign:"center", margin:"20px 0 8px"}}>Gym Log · {VERSION}</p>
      </section>
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */
function App() {
  // Arranque instantáneo: si hay copia local, la app se pinta con ella y la
  // hoja se consulta por detrás. La pantalla de espera solo aparece la
  // primerísima vez, cuando todavía no hay nada guardado en el teléfono.
  const cacheInicial = leeLocal(K_CACHE, null);
  const [datos, setDatos] = useState(cacheInicial);
  const [estado, setEstado] = useState(!configurada() ? "sinconfig" : (cacheInicial ? "listo" : "cargando"));
  const [refrescando, setRefrescando] = useState(false);
  const [error, setError] = useState("");
  const [sinRed, setSinRed] = useState(!navigator.onLine);
  const [cola, setCola] = useState(() => leeLocal(K_COLA, []));
  // Ejercicios creados sin conexión: viven aquí hasta que la hoja les da un ID real.
  const [nuevosEj, setNuevosEj] = useState(() => leeLocal(K_NUEVOS, []));
  const [creandoEj, setCreandoEj] = useState(false);

  const [sesion, setSesion] = useState(null);
  const [transcurrido, setTranscurrido] = useState(0);
  const [descanso, setDescanso] = useState(null);
  const [catalogoAbierto, setCatalogoAbierto] = useState(null);
  const [hoja, setHoja] = useState(null);
  const [modalTexto, setModalTexto] = useState(null);
  const [resumen, setResumen] = useState(null);
  const [editor, setEditor] = useState(null);
  const [guardandoPl, setGuardandoPl] = useState(false);
  const [aviso, setAviso] = useState("");
  const avisoRef = useRef(null);

  const mostrarAviso = t => { setAviso(t); clearTimeout(avisoRef.current);
    avisoRef.current = setTimeout(() => setAviso(""), 2600); };

  /* --- carga inicial --------------------------------------------------- */
  /* --- carga: siempre en segundo plano si ya hay datos ------------------ */
  const mismos = (a, b) => {
    if (!a || !b) return false;
    const limpia = d => JSON.stringify(Object.assign({}, d, { servidor: 0 }));
    return limpia(a) === limpia(b);
  };

  const cargar = async (silencioso, conAviso = true, fresco = false) => {
    if (!configurada()) { setEstado("sinconfig"); return; }
    if (!datos) setEstado("cargando");
    setRefrescando(true);
    try {
      const d = await API.bootstrap(fresco);
      if (!mismos(d, datos)) { setDatos(d); guardaLocal(K_CACHE, d); }
      setEstado("listo"); setError("");
      if (silencioso && conAviso) mostrarAviso("Datos actualizados desde la hoja.");
    } catch (e) {
      setError(String(e.message || e));
      setEstado(datos ? "listo" : "error");
      if (silencioso && conAviso) mostrarAviso("No se pudo actualizar. Sigues con los datos locales.");
    } finally { setRefrescando(false); }
  };

  useEffect(() => { cargar(false); }, []);

  useEffect(() => {
    const on = () => { setSinRed(false); sincronizar(); };
    const off = () => setSinRed(true);
    window.addEventListener("online", on); window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  });

  /* --- cola de envíos --------------------------------------------------- */
  const limpiarTemporales = payload => {
    const ids = (payload.ejerciciosNuevos || []).map(x => x.id);
    if (!ids.length) return;
    const q = leeLocal(K_NUEVOS, []).filter(x => ids.indexOf(x.id) === -1);
    guardaLocal(K_NUEVOS, q); setNuevosEj(q);
  };

  const sincronizar = async () => {
    const pend = leeLocal(K_COLA, []);
    if (!pend.length || !configurada()) return;
    const quedan = [];
    for (const p of pend) {
      try { await API.guardar(p); limpiarTemporales(p); } catch (e) { quedan.push(p); }
    }
    guardaLocal(K_COLA, quedan); setCola(quedan);
    if (quedan.length < pend.length) { mostrarAviso("Entrenamientos sincronizados."); cargar(true, false, true); }
    else if (pend.length) mostrarAviso("Todavía no se pudo subir. Lo reintento después.");

    // Ejercicios provisorios que quedaron sueltos (creados sin señal y nunca
    // usados en un entrenamiento). Fuera de una sesión activa se dan de alta.
    const sueltos = leeLocal(K_NUEVOS, []);
    if (!sesion && sueltos.length) {
      const faltantes = [];
      let alguno = false;
      for (const t of sueltos) {
        try {
          await API.crearEjercicio({ nombre:t.nombre, musculo:t.musculo, categoria:t.categoria,
            descansoSeg:t.descansoSeg, urlImagen:t.urlImagen || "" });
          alguno = true;
        } catch (e) { faltantes.push(t); }
      }
      guardaLocal(K_NUEVOS, faltantes); setNuevosEj(faltantes);
      if (alguno) { mostrarAviso("Ejercicios pendientes agregados al catálogo."); cargar(true, false, true); }
    }
  };

  useEffect(() => { if (estado === "listo") sincronizar(); }, [estado]);

  /* --- cronómetros ------------------------------------------------------ */
  const inicioTs = sesion ? sesion.inicioTs : null;
  useEffect(() => {
    if (!inicioTs) return;
    const t = setInterval(() => setTranscurrido(Math.floor((Date.now() - inicioTs) / 1000)), 1000);
    return () => clearInterval(t);
  }, [inicioTs]);

  const descansoActivo = descanso !== null;
  useEffect(() => {
    if (!descansoActivo) return;
    const t = setInterval(() => setDescanso(d => (!d || d.restante === 0) ? d : { ...d, restante: d.restante - 1 }), 1000);
    return () => clearInterval(t);
  }, [descansoActivo]);

  useEffect(() => {
    if (!descanso || descanso.restante !== 0) return;
    try { if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
    mostrarAviso("Descanso terminado. A por la siguiente serie.");
    const t = setTimeout(() => setDescanso(null), 900);
    return () => clearTimeout(t);
  }, [descanso]);

  /* --- índices ---------------------------------------------------------- */
  const catalogo = useMemo(() =>
    datos ? datos.catalogo.concat(nuevosEj) : nuevosEj, [datos, nuevosEj]);
  const ej = useMemo(() => Object.fromEntries(catalogo.map(e => [e.id, e])), [catalogo]);

  const historial = useMemo(() => {
    if (!datos) return {};
    const fechas = Object.fromEntries(datos.entrenamientos.map(e => [e.id, `${e.fecha} ${e.horaInicio || "00:00"}`]));
    const idx = {};
    datos.series.forEach(s => {
      if (!s.check || s.esCalentamiento) return;
      const ts = fechas[s.idEntrenamiento]; if (!ts) return;
      const a = idx[s.idEjercicio];
      if (!a || ts > a.ts) idx[s.idEjercicio] = { ts, idEntrenamiento: s.idEntrenamiento, fecha: ts.split(" ")[0], series: [] };
    });
    datos.series.forEach(s => {
      const r = idx[s.idEjercicio];
      if (r && s.idEntrenamiento === r.idEntrenamiento && s.check && !s.esCalentamiento) r.series.push(s);
    });
    Object.values(idx).forEach(r => r.series.sort((a,b) => a.numSerie - b.numSerie));
    return idx;
  }, [datos]);

  const records = useMemo(() => {
    const r = {};
    if (datos) datos.series.forEach(s => { if (s.check && !s.esCalentamiento) r[s.idEjercicio] = Math.max(r[s.idEjercicio] || 0, s.kg); });
    return r;
  }, [datos]);

  /* --- sesión ----------------------------------------------------------- */
  const nuevoBloque = (idEjercicio, objetivo, reps, fallback) => {
    const cat = ej[idEjercicio] || fallback || { descansoSeg: 90 };
    const prev = historial[idEjercicio];
    const total = prev ? Math.max(prev.series.length, 1) : (objetivo || 3);
    return { uid: nuevoId("BL"), idEjercicio, descansoSeg: cat.descansoSeg || 90, nota: "",
      series: Array.from({length: total}, () => ({ id: nuevoId("SE"), kg:"",
        reps: reps ? String(reps) : "", check:false, esCalentamiento:false, notas:"" })) };
  };

  const iniciarSesion = plantilla => {
    const ejercicios = plantilla
      ? datos.plantillasDetalle.filter(d => d.idPlantilla === plantilla.id)
          .sort((a,b) => a.orden - b.orden).map(d => nuevoBloque(d.idEjercicio, d.seriesObjetivo))
      : [];
    setSesion({ id: nuevoId("SES"), fecha: hoyISO(), horaInicio: horaAhora(), inicioTs: Date.now(),
      nombre: plantilla ? plantilla.nombreRutina : nombrePorHora(),
      idPlantilla: plantilla ? plantilla.id : "", ejercicios });
    setTranscurrido(0); setDescanso(null);
  };

  const editarSesion = fn => setSesion(s => s ? fn(s) : s);
  const editarBloque = (uid, fn) => editarSesion(s => ({ ...s, ejercicios: s.ejercicios.map(b => b.uid === uid ? fn(b) : b) }));
  const cambiarSerie = (uid, sid, campo, valor) =>
    editarBloque(uid, b => ({ ...b, series: b.series.map(x => x.id === sid ? { ...x, [campo]: valor } : x) }));

  const alternarCheck = (uid, sid, anterior) => {
    let arranca = false, seg = 0;
    editarBloque(uid, b => {
      seg = b.descansoSeg;
      return { ...b, series: b.series.map(x => {
        if (x.id !== sid) return x;
        if (!x.check) {
          arranca = !x.esCalentamiento;
          return { ...x, check:true,
            kg: x.kg === "" ? (anterior ? String(anterior.kg) : "0") : x.kg,
            reps: x.reps === "" ? (anterior ? String(anterior.reps) : "0") : x.reps };
        }
        return { ...x, check:false };
      })};
    });
    if (arranca && seg > 0) setDescanso({ restante: seg, total: seg });
  };

  const agregarSerie = uid => editarBloque(uid, b => ({ ...b,
    series: [...b.series, { id: nuevoId("SE"), kg:"", reps:"", check:false, esCalentamiento:false, notas:"" }] }));

  const agregarCalentamiento = uid => editarBloque(uid, b => ({ ...b, series: [
    { id: nuevoId("SE"), kg:"", reps:"", check:false, esCalentamiento:true, notas:"" },
    { id: nuevoId("SE"), kg:"", reps:"", check:false, esCalentamiento:true, notas:"" },
    ...b.series ]}));

  // map() entrega (valor, índice, arreglo): hay que llamar a nuevoBloque con
  // un solo argumento, si no el índice y el arreglo caen en objetivo y reps.
  const agregarEjercicios = ids => {
    editarSesion(s => ({ ...s, ejercicios: [...s.ejercicios, ...ids.map(id => nuevoBloque(id))] }));
    setCatalogoAbierto(null);
  };

  const reemplazar = (uid, id) => {
    editarBloque(uid, b => ({ ...b, idEjercicio:id, descansoSeg:(ej[id]||{}).descansoSeg || 90,
      series: b.series.map(x => ({ ...x, kg:"", reps:"", check:false })) }));
    setCatalogoAbierto(null);
  };

  /* --- guardar ---------------------------------------------------------- */
  const calcularResumen = () => {
    let volumen = 0, sets = 0; const prs = [];
    sesion.ejercicios.forEach(b => {
      let mejor = 0;
      b.series.forEach(s => {
        if (!s.check || s.esCalentamiento) return;
        sets += 1; volumen += num(s.kg) * num(s.reps); mejor = Math.max(mejor, num(s.kg));
      });
      if (mejor > 0 && mejor > (records[b.idEjercicio] || 0))
        prs.push({ nombre: (ej[b.idEjercicio]||{}).nombre, kg: mejor });
    });
    return { volumen, sets, prs, duracion: transcurrido };
  };

  const guardarSesion = async () => {
    const series = [];
    sesion.ejercicios.forEach(b => {
      let n = 0;
      b.series.forEach(s => {
        if (!s.check) return;
        if (!s.esCalentamiento) n += 1;
        series.push({ idEjercicio: b.idEjercicio, numSerie: s.esCalentamiento ? 0 : n,
          kg: num(s.kg), reps: num(s.reps), check: true, esCalentamiento: s.esCalentamiento, notas: s.notas || "" });
      });
    });

    const usados = {};
    series.forEach(x => { usados[x.idEjercicio] = true; });
    const ejerciciosNuevos = nuevosEj.filter(x => usados[x.id]);

    const payload = { clienteId: sesion.id, fecha: sesion.fecha, horaInicio: sesion.horaInicio,
      horaFin: horaAhora(), nombre: sesion.nombre, idPlantilla: sesion.idPlantilla,
      series, ejerciciosNuevos };

    // 1) estado local optimista: el historial se actualiza al tiro
    const idLocal = "LOCAL-" + sesion.id;
    const nuevos = {
      ...datos,
      entrenamientos: [...datos.entrenamientos, { id: idLocal, fecha: payload.fecha,
        horaInicio: payload.horaInicio, horaFin: payload.horaFin, nombre: payload.nombre, idPlantilla: payload.idPlantilla }],
      series: [...datos.series, ...series.map((s,i) => ({ ...s, id: idLocal + "-" + i, idEntrenamiento: idLocal }))],
      plantillasHeader: datos.plantillasHeader.map(p => p.id === payload.idPlantilla ? { ...p, fechaUltima: payload.fecha } : p)
    };
    setDatos(nuevos); guardaLocal(K_CACHE, nuevos);

    // 2) envío
    setResumen(null); setSesion(null); setDescanso(null);
    try {
      await API.guardar(payload);
      limpiarTemporales(payload);
      mostrarAviso("Entrenamiento guardado en la hoja.");
      cargar(true, false, true);
    } catch (e) {
      const q = [...leeLocal(K_COLA, []), payload];
      guardaLocal(K_COLA, q); setCola(q);
      mostrarAviso("Guardado en el teléfono. Se subirá cuando haya conexión.");
    }
  };

  /* --- catálogo ---------------------------------------------------------- */
  // permitirTemporal: solo dentro de un entrenamiento. Una plantilla NUNCA puede
  // apuntar a un ID provisorio, porque queda escrito en la hoja sin respaldo.
  const crearEjercicio = async (def, permitirTemporal) => {
    const base = { nombre: def.nombre, musculo: def.musculo, categoria: def.categoria,
                   descansoSeg: def.descansoSeg, urlImagen: def.urlImagen || "" };
    setCreandoEj(true);
    try {
      const r = await API.crearEjercicio(base);
      const d = Object.assign({}, datos, { catalogo: datos.catalogo.concat([r.ejercicio]) });
      setDatos(d); guardaLocal(K_CACHE, d);
      mostrarAviso("Ejercicio guardado en el catálogo.");
      return r.ejercicio;
    } catch (e) {
      if (permitirTemporal === false) {
        mostrarAviso("No se pudo crear el ejercicio: " + (e.message || "revisa la conexión"));
        throw e;
      }
      // Entrenando sin señal: ID provisorio, la hoja lo bautiza al sincronizar.
      const temp = Object.assign({ id: "TMP-" + Date.now().toString(36) }, base);
      const q = nuevosEj.concat([temp]);
      setNuevosEj(q); guardaLocal(K_NUEVOS, q);
      mostrarAviso("Sin conexión: el ejercicio se creará al sincronizar.");
      return temp;
    } finally { setCreandoEj(false); }
  };

  /* --- plantillas -------------------------------------------------------- */
  const itemsDe = plantilla => datos.plantillasDetalle
    .filter(d => d.idPlantilla === plantilla.id).sort((a,b) => a.orden - b.orden)
    .map(d => ({ idEjercicio: d.idEjercicio, seriesObjetivo: d.seriesObjetivo || 3 }));

  const guardarPlantilla = async payload => {
    setGuardandoPl(true);
    try {
      await API.guardarPlantilla(payload);
      await cargar(true, false, true);     // fresco: trae el ID real que asignó la hoja
      setEditor(null);
      mostrarAviso(payload.id ? "Plantilla actualizada." : "Plantilla creada.");
    } catch (e) {
      mostrarAviso("No se pudo guardar: " + (e.message || "revisa la conexión"));
    } finally { setGuardandoPl(false); }
  };

  const borrarPlantilla = async p => {
    setHoja(null);
    try {
      await API.eliminarPlantilla(p.id);
      await cargar(true, false, true);
      mostrarAviso("Plantilla eliminada. El historial no se toca.");
    } catch (e) {
      mostrarAviso("No se pudo eliminar: " + (e.message || "revisa la conexión"));
    }
  };

  const menuPlantilla = p => setHoja({ titulo: p.nombreRutina, opciones: [
    { icono:<IcPlay/>, texto:"Iniciar este entrenamiento",
      onClick: () => { setHoja(null); iniciarSesion(p); } },
    { icono:<IcLapiz/>, texto:"Editar plantilla",
      onClick: () => { setHoja(null); setEditor({ id:p.id, nombreRutina:p.nombreRutina, items:itemsDe(p) }); } },
    { icono:<IcCopia/>, texto:"Duplicar",
      onClick: () => { setHoja(null); setEditor({ id:"", nombreRutina:p.nombreRutina + " (copia)", items:itemsDe(p) }); } },
    { icono:<IcTrash/>, texto:"Eliminar plantilla", color:"var(--rojo)",
      onClick: () => setHoja({ titulo:"¿Eliminar " + p.nombreRutina + "? Los entrenamientos ya registrados se mantienen.",
        opciones:[{ icono:<IcTrash/>, texto:"Sí, eliminar", color:"var(--rojo)", onClick: () => borrarPlantilla(p) }] }) },
  ]});

  /* --- menús ------------------------------------------------------------ */
  const menuEjercicio = b => setHoja({ titulo: (ej[b.idEjercicio]||{}).nombre, opciones: [
    { icono:<IcNota/>, texto:"Añadir nota", onClick: () => { setHoja(null);
      setModalTexto({ titulo:"Nota del ejercicio", valorInicial:b.nota, placeholder:"Ej: bajar controlado 3 segundos",
        onGuardar:v => { editarBloque(b.uid, x => ({...x, nota:v})); setModalTexto(null); } }); } },
    { icono:<IcFuego/>, texto:"Añadir series de calentamiento", onClick: () => { agregarCalentamiento(b.uid); setHoja(null); } },
    { icono:<IcTimer/>, texto:"Actualizar temporizador de descanso", onClick: () => setHoja({ titulo:"Descanso entre series",
        opciones:[30,60,90,120,150,180].map(sg => ({ icono:<IcClock/>, texto:fmtMMSS(sg),
          onClick: () => { editarBloque(b.uid, x => ({...x, descansoSeg:sg})); setHoja(null); } })) }) },
    { icono:<IcSwap/>, texto:"Remplazar ejercicio", onClick: () => { setHoja(null); setCatalogoAbierto({ modo:"reemplazar", uid:b.uid }); } },
    { icono:<IcTrash/>, texto:"Eliminar ejercicio", color:"var(--rojo)",
      onClick: () => { editarSesion(s => ({...s, ejercicios:s.ejercicios.filter(x => x.uid !== b.uid)})); setHoja(null); } },
  ]});

  const menuSerie = (b, sid) => {
    const s = b.series.find(x => x.id === sid);
    setHoja({ titulo:`Serie · ${(ej[b.idEjercicio]||{}).nombre}`, opciones: [
      { icono:<IcFuego/>, texto: s.esCalentamiento ? "Quitar de calentamiento" : "Marcar como calentamiento",
        onClick: () => { editarBloque(b.uid, x => ({...x, series:x.series.map(y => y.id === sid ? {...y, esCalentamiento:!y.esCalentamiento} : y)})); setHoja(null); } },
      { icono:<IcNota/>, texto:"Añadir nota a la serie", onClick: () => { setHoja(null);
        setModalTexto({ titulo:"Nota de la serie", valorInicial:s.notas, placeholder:"Ej: última rep con ayuda",
          onGuardar:v => { cambiarSerie(b.uid, sid, "notas", v); setModalTexto(null); } }); } },
      { icono:<IcTrash/>, texto:"Eliminar serie", color:"var(--rojo)",
        onClick: () => { editarBloque(b.uid, x => ({...x, series:x.series.filter(y => y.id !== sid)})); setHoja(null); } },
    ]});
  };

  /* --- pantallas de estado ---------------------------------------------- */
  if (estado === "sinconfig") return (
    <div className="app px"><div className="centro">
      <IcPesa size={30}/>
      <h1>Falta configurar la app</h1>
      <p className="small muted">Abre <code>index.html</code> y reemplaza las constantes
        <code>API_URL</code> y <code>TOKEN</code> con la URL de tu Apps Script y tu clave.</p>
    </div></div>
  );

  if (estado === "cargando") return (
    <div className="app px"><div className="centro"><div className="spin"/>
      <p className="small muted">Leyendo la hoja de cálculo…</p></div></div>
  );

  if (estado === "error" || !datos) return (
    <div className="app px"><div className="centro">
      <h1>No pude leer la hoja</h1>
      <p className="small muted">{error}</p>
      <p className="xs muted3">Revisa que la implementación del Apps Script tenga acceso "Cualquier persona"
        y que el token del index.html sea el mismo del Codigo.gs.</p>
      <button className="btn btn-azul" style={{maxWidth:220}} onClick={() => cargar(false)}>Reintentar</button>
    </div></div>
  );

  /* --- render principal -------------------------------------------------- */
  return (
    <div className="app">
      {!sesion && !editor && (
        <Home datos={datos} pendientes={cola.length} sinRed={sinRed} refrescando={refrescando}
          onIniciarVacio={() => iniciarSesion(null)}
          onIniciarPlantilla={iniciarSesion}
          onSincronizar={sincronizar}
          onRecargar={() => cargar(true, true, true)}
          onNuevaPlantilla={() => setEditor({ id:"", nombreRutina:"", items:[] })}
          onMenuPlantilla={menuPlantilla} />
      )}

      {editor && !sesion && (
        <EditorPlantilla inicial={editor} catalogo={catalogo} historial={historial}
          guardando={guardandoPl} creandoEj={creandoEj} onCrearEjercicio={crearEjercicio}
          onGuardar={guardarPlantilla} onCerrar={() => setEditor(null)} />
      )}

      {sesion && (
        <div>
          <div className="barra"><div className="barra-in">
            <button className="btn btn-cuadro" onClick={() => setHoja({ titulo:"Iniciar temporizador de descanso",
              opciones:[30,60,90,120,180].map(sg => ({ icono:<IcTimer/>, texto:fmtMMSS(sg),
                onClick: () => { setDescanso({restante:sg, total:sg}); setHoja(null); } })) })}>
              <IcTimer/>
            </button>
            <div style={{flex:1, textAlign:"center"}}>
              {descanso ? <span className="b num" style={{fontSize:18, color:"var(--azul-b)"}}>{fmtMMSS(descanso.restante)}</span> : null}
            </div>
            <button className="btn btn-verde" onClick={() => setResumen(calcularResumen())}>Terminar</button>
          </div></div>

          <div className="px" style={{paddingTop:18}}>
            <div style={{display:"flex", alignItems:"flex-start", gap:8}}>
              <h1 style={{flex:1, lineHeight:1.15}}>{sesion.nombre}</h1>
              <button className="btn btn-cuadro" style={{width:36, height:36, color:"var(--azul-b)"}}
                onClick={() => setModalTexto({ titulo:"Nombre del entrenamiento", valorInicial:sesion.nombre,
                  placeholder:"Ej: Pecho pesado", onGuardar:v => { editarSesion(s => ({...s, nombre:v || s.nombre})); setModalTexto(null); } })}>
                <IcMas size={18}/>
              </button>
            </div>
            <p className="muted" style={{display:"flex", alignItems:"center", gap:8, margin:"8px 0 0"}}><IcCal size={16}/> {fechaCorta(sesion.fecha)}</p>
            <p className="muted num" style={{display:"flex", alignItems:"center", gap:8, margin:"4px 0 22px"}}><IcClock size={16}/> {fmtCrono(transcurrido)}</p>

            {!sesion.ejercicios.length && (
              <div style={{border:"1px dashed var(--linea)", borderRadius:16, padding:30, textAlign:"center", marginBottom:20}}>
                <IcPesa size={26}/><p className="small muted" style={{margin:"8px 0 0"}}>
                  Todavía no hay ejercicios. Añade el primero desde el catálogo.</p>
              </div>
            )}

            {sesion.ejercicios.map(b => (
              <Bloque key={b.uid} bloque={b} ej={ej} historial={historial}
                onMenuEjercicio={() => menuEjercicio(b)}
                onMenuSerie={sid => menuSerie(b, sid)}
                onCambio={(sid,c,v) => cambiarSerie(b.uid, sid, c, v)}
                onCheck={(sid,ant) => alternarCheck(b.uid, sid, ant)}
                onAgregarSerie={() => agregarSerie(b.uid)} />
            ))}

            <button className="btn btn-azul-suave" style={{marginBottom:10}}
              onClick={() => setCatalogoAbierto({ modo:"agregar" })}>Añadir ejercicios</button>
            <button className="btn btn-rojo-suave" onClick={() => setHoja({ titulo:"Se perderán las series de esta sesión",
              opciones:[{ icono:<IcTrash/>, texto:"Cancelar entrenamiento", color:"var(--rojo)",
                onClick: () => { setSesion(null); setDescanso(null); setHoja(null); mostrarAviso("Entrenamiento descartado."); } }] })}>
              Cancelar entrenamiento
            </button>
          </div>
        </div>
      )}

      {descanso && <BarraDescanso d={descanso}
        onAjustar={v => setDescanso(x => x ? { ...x, restante: Math.max(1, x.restante + v), total: Math.max(x.total, x.restante + v) } : x)}
        onSaltar={() => setDescanso(null)} />}

      {catalogoAbierto && <ModalCatalogo catalogo={catalogo} modo={catalogoAbierto.modo} historial={historial}
        creando={creandoEj}
        onCerrar={() => setCatalogoAbierto(null)}
        onConfirmar={ids => catalogoAbierto.modo === "reemplazar" ? reemplazar(catalogoAbierto.uid, ids[0]) : agregarEjercicios(ids)}
        onCrear={async def => {
          const e = await crearEjercicio(def);
          if (catalogoAbierto.modo === "reemplazar") { reemplazar(catalogoAbierto.uid, e.id); return; }
          editarSesion(x => ({ ...x, ejercicios: [...x.ejercicios, nuevoBloque(e.id, def.series, def.reps, e)] }));
          setCatalogoAbierto(null);
        }} />}

      {hoja && <Hoja titulo={hoja.titulo} opciones={hoja.opciones} onCerrar={() => setHoja(null)} />}

      {modalTexto && <ModalTexto {...modalTexto} onCerrar={() => setModalTexto(null)} />}

      {resumen && (
        <div className="fondo"><div className="hoja" style={{padding:20}}>
          <h3 style={{marginBottom:16, fontSize:20}}>Resumen del entrenamiento</h3>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:16}}>
            <div style={{background:"var(--card2)", borderRadius:12, padding:12}}>
              <p className="xs muted" style={{margin:0}}>Duración</p>
              <p className="b num" style={{margin:0, fontSize:18}}>{fmtCrono(resumen.duracion)}</p></div>
            <div style={{background:"var(--card2)", borderRadius:12, padding:12}}>
              <p className="xs muted" style={{margin:0}}>Volumen</p>
              <p className="b num" style={{margin:0, fontSize:18}}>{resumen.volumen.toLocaleString("es-CL")}</p></div>
            <div style={{background:"var(--card2)", borderRadius:12, padding:12}}>
              <p className="xs muted" style={{margin:0}}>Sets</p>
              <p className="b num" style={{margin:0, fontSize:18}}>{resumen.sets}</p></div>
          </div>
          {resumen.prs.length > 0 && (
            <div style={{background:"rgba(245,158,11,.14)", borderRadius:12, padding:12, marginBottom:16}}>
              <p className="sb" style={{margin:"0 0 4px", color:"var(--ambar)", display:"flex", alignItems:"center", gap:8}}>
                <IcSube size={16}/> Nuevos PR</p>
              {resumen.prs.map((p,i) => <p key={i} className="small muted" style={{margin:0}}>{p.nombre} — {p.kg} kg</p>)}
            </div>
          )}
          {resumen.sets === 0 && <p className="small muted" style={{marginBottom:16}}>
            No hay series marcadas. Si guardas ahora, la sesión quedará vacía.</p>}
          <div style={{display:"flex", gap:8}}>
            <button className="btn btn-gris" onClick={() => setResumen(null)}>Seguir entrenando</button>
            <button className="btn" style={{width:"100%", height:46, background:"var(--verde)", color:"#052e16"}}
              onClick={guardarSesion}>Guardar</button>
          </div>
        </div></div>
      )}

      {aviso && <div className="toast"><div>{aviso}</div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
